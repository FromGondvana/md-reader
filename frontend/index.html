<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>MD Reader</title>
</head>
<body>
<div id="app">
    <header id="topbar">
        <button id="btn-back" class="icon-btn" title="Назад (Alt+←)" disabled></button>
        <button id="btn-fwd" class="icon-btn" title="Вперёд (Alt+→)" disabled></button>
        <button id="btn-open-folder" title="Открыть папку проекта">
            <span id="project-icon"></span><span id="project-name">Открыть папку…</span>
        </button>
        <div id="breadcrumb"></div>
        <div class="tb-spacer"></div>
        <button id="btn-edit" class="tb-action" title="Редактировать (Ctrl+E)" disabled></button>
        <button id="btn-export" class="tb-action" title="Экспорт в HTML / PDF" disabled></button>
        <button id="btn-palette" class="tb-action" title="Быстрый переход к файлу (Ctrl+P)"></button>
        <button id="btn-search" class="tb-action" title="Поиск по всем файлам (Ctrl+Shift+F)"></button>
        <button id="btn-tree" class="icon-btn" title="Дерево файлов (Ctrl+B)"></button>
        <button id="btn-toc" class="icon-btn" title="Оглавление"></button>
        <button id="btn-theme" class="icon-btn" title="Тема"></button>
    </header>
    <div id="main">
        <aside id="sidebar">
            <div id="tree-toolbar">
                <button id="btn-newfile" class="icon-btn" title="Новый файл (в корне проекта)"></button>
                <button id="btn-sort" class="tt-sort" title="Сортировка"></button>
                <span class="tt-spacer"></span>
                <button id="btn-masks" class="tt-mask" title="Маски фильтрации"></button>
            </div>
            <div id="tree"></div>
        </aside>
        <div id="divider"></div>
        <main id="content">
            <div id="welcome" class="hidden"></div>
            <article id="reader"></article>
            <div id="editor-root" class="hidden">
                <div id="editor-toolbar"></div>
                <div id="editor-host"></div>
            </div>
        </main>
        <aside id="toc-panel" class="hidden">
            <div id="toc-title">На этой странице</div>
            <nav id="toc"></nav>
        </aside>
    </div>
</div>
<div id="overlay-root"></div>
<div id="toast-root"></div>
<script src="./src/main.ts" type="module"></script>
</body>
</html>
